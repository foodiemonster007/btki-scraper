[ChapterListBodyHtmlData]
by="css selector"
element="ul"

[ChapterListItemHtmlData]
by="tag name"
element="li"

[NextChapterButtonHtmlData]
by="xpath"
element="//a[contains(., 'Continue to next part')]"

[ChapterTextBodyHtmlData]
by="css selector"
element="article.story-part .page pre"
strip_trailing_plus="true"
scroll_to_bottom="true"

[InitialChapterLookupSettings]
mode="embedded_json"

[ChapterListJavaScriptData]
script="return window.__remixContext.state.loaderData['routes/story.$storyid'].story.parts.map(function(p){return p.url;});"

[LoginSettings]
require_manual_login="true"
login_url="https://www.wattpad.com/login"
